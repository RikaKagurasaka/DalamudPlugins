name: Sync Damage Info Extended

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the latest source release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .sync-work/package
          if ! curl --fail --silent --show-error --location \
            --output .sync-work/release.json \
            https://api.github.com/repos/RikaKagurasaka/DamageInfoExtended/releases/latest; then
            echo "No public release exists yet; leaving the feed unchanged."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          asset_url="$(jq -r '.assets[] | select(.name == "latest.zip") | .browser_download_url' .sync-work/release.json)"
          if [[ -z "$asset_url" || "$asset_url" == "null" ]]; then
            echo "Latest release has no latest.zip asset." >&2
            exit 1
          fi

          curl --fail --silent --show-error --location --output .sync-work/latest.zip "$asset_url"
          unzip -q .sync-work/latest.zip -d .sync-work/package
          manifest=".sync-work/package/DamageInfoExtended.json"
          test -f "$manifest"
          jq -e '
            .InternalName == "DamageInfoExtended" and
            (.AssemblyVersion | type == "string") and
            (.DalamudApiLevel | type == "number")
          ' "$manifest" > /dev/null

          jq --arg assetUrl "$asset_url" \
            '[. + {DownloadLinkInstall: $assetUrl, DownloadLinkUpdate: $assetUrl}]' \
            "$manifest" > pluginmaster.json
          echo "available=true" >> "$GITHUB_OUTPUT"
      - name: Commit updated feed
        if: steps.release.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pluginmaster.json; then
            echo "Feed already points to the latest release."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pluginmaster.json
          git commit -m "Update Damage Info Extended feed"
          git push
